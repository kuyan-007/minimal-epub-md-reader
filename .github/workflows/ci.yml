name: CI

# PR / push 到 main 时触发：cargo check + 前端编译检查
# 目的：合并前拦截编译错误，无需在本地 cargo build 反馈
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: >-
            ${{ runner.os }}-cargo-
            ${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Cargo check (Rust 端)
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Frontend lint (可选)
        shell: bash
        run: |
          echo "Node 语法快速检查（无 lint 框架）"
          node --check src/main.js && echo "main.js OK"
