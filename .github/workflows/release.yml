name: Release Windows

# 推送版本 tag 后构建安装包与便携版，并发布 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: >-
            ${{ runner.os }}-cargo-
            ${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          "body<<RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          Get-Content -Raw -Encoding UTF8 RELEASE_NOTES.md >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Attach portable exe and zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $source = 'src-tauri/target/release/minimal-epub-reader.exe'
          if (-not (Test-Path -LiteralPath $source)) { throw "Missing release executable: $source" }
          $portable = "minimal-epub-reader_v$version.exe"
          $archive = "minimal-epub-reader_v$version.zip"
          Copy-Item -LiteralPath $source -Destination $portable
          Compress-Archive -LiteralPath $portable -DestinationPath $archive
          gh release upload "${{ github.ref_name }}" $portable $archive --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
